name: Daily Newspaper

# Publication labels inside the issue use NEWS_TIMEZONE (default America/Chicago).
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - daily-newspaper-generator

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-newspaper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEWS_TIMEZONE: ${{ vars.NEWS_TIMEZONE }}
      NEWS_MAX_PER_SECTION: ${{ vars.NEWS_MAX_PER_SECTION }}
      NEWS_FETCH_TIMEOUT_MS: ${{ vars.NEWS_FETCH_TIMEOUT_MS }}
      NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate daily issue
        run: npm run generate:news

      - name: Run tests
        run: npm run test:ci

      - name: Build site
        run: npm run build
        env:
          CI: true

      - name: Commit refreshed issue data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json
          if git diff --staged --quiet; then
            echo "No issue data changes to commit"
          else
            git commit -m "chore: refresh daily newspaper issue"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
